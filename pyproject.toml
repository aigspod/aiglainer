[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiglainer"
version = "0.1.0"
description = "aigspod explainers: narrated motion-graphics videos about papers, books and more, built in code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "aiglainer/fonts/OFL-*.txt"]
# Ranges here; the exact versions are locked in pixi.lock (`pixi install`, the supported way to set up). Under pixi
# most of these come from conda-forge (see [tool.pixi.dependencies]); a plain `pip install .` takes them from PyPI.
dependencies = ["skia-python>=144", "pymupdf>=1.24", "numpy>=2.0", "pillow>=10", "scipy>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
# Narration: Kokoro-82M via mlx-audio, Whisper via mlx-whisper (Apple Silicon).
tts = ["mlx-audio>=0.6", "mlx>=0.30", "misaki[en]>=0.9", "spacy>=3.8", "mlx-whisper>=0.4", "soundfile>=0.12"]

[project.urls]
Repository = "https://github.com/aigspod/aiglainer"

[project.scripts]
aiglainer = "aiglainer.__main__:main"

[tool.setuptools]
packages = ["aiglainer"]

[tool.setuptools.package-data]
aiglainer = ["fonts/*", "template/*", "template/**/*", "template/paper/.gitkeep"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Built and tested on Apple Silicon Macs only (mlx, SF Pro fallback fonts); mlx's conda-forge builds need macOS 14.5+.
platforms = [{ name = "apple-silicon", platform = "osx-arm64", macos = "14.5" }]

# From conda-forge: Python, the scientific stack, the command-line tools the build calls, and the narration
# stack. From PyPI (via [project] dependencies above): skia-python and mlx-whisper, which conda-forge lacks, and
# pymupdf, whose conda-forge build pixi doesn't count as satisfying PyPI's (it would install both).
[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.0"
scipy = ">=1.13"
pillow = ">=10"
matplotlib = ">=3.9"
ffmpeg = ">=7"
tectonic = ">=0.15"
mlx = ">=0.30"
mlx-audio = ">=0.6"
misaki = ">=0.9"
spacy = ">=3.8"
spacy-model-en_core_web_sm = ">=3.8"
pysoundfile = ">=0.12"
num2words = ">=0.5"                # misaki's English extra (conda-forge's misaki leaves it out)
pytorch = ">=2.5"                  # for mlx-whisper; from conda so torch shares conda's OpenMP runtime

[tool.pixi.pypi-dependencies]
aiglainer = { path = ".", editable = true }
# misaki's English extra, which conda-forge's misaki doesn't carry: Kokoro's espeak fallback for unusual words
espeakng-loader = ">=0.2"
phonemizer-fork = ">=3.3"

[tool.pixi.environments]
default = { features = ["tts"], solve-group = "default" }
